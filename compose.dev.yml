services:
  app:
    build:
      context: .
      dockerfile: docker/dev/php/Dockerfile
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      # Clave no secreta, exclusiva para el contenedor de desarrollo.
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SEARCH_LOCAL_PREVIEW: "true"
      SEARCH_PREVIEW_DATABASE: /var/www/html/database/preview.sqlite
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:8000:8000"
    entrypoint: ["/usr/local/bin/kp-search-entrypoint"]
    command: ["sh", "-c", "cd public && exec php -d opcache.enable_cli=1 -d opcache.validate_timestamps=1 -d opcache.revalidate_freq=0 -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]

  vite:
    build:
      context: .
      dockerfile: docker/dev/node/Dockerfile
    environment:
      VITE_HMR_HOST: localhost
      VITE_USE_POLLING: "true"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    entrypoint: ["/usr/local/bin/kp-search-node-entrypoint"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  node_modules:
  vendor:
